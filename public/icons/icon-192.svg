<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded corners for maskable icon -->
  <rect width="192" height="192" rx="36" fill="#0f172a" />
  <rect x="8" y="8" width="176" height="176" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Chef Hat & Spoon Icon -->
  <g transform="translate(36, 32)" filter="url(#shadow)">
    <!-- Chef Hat Base -->
    <path d="M20 90 L100 90 L95 106 L25 106 Z" fill="url(#grad)" />
    <rect x="23" y="100" width="74" height="4" rx="2" fill="#fff" opacity="0.4"/>
    <!-- Chef Hat Puffs -->
    <path d="M25 88 C10 88 5 65 20 55 C12 40 30 25 45 35 C55 18 75 18 85 32 C98 25 112 38 105 55 C118 68 110 88 95 88 Z" fill="url(#grad)" />
    <!-- Audio Wave Lines (Voice Interface Badge) -->
    <path d="M40 65 L40 75 M50 58 L50 82 M60 52 L60 88 M70 58 L70 82 M80 65 L80 75" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>