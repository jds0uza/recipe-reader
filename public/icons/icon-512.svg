<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1e16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background in signature kitchen forest green -->
  <rect width="512" height="512" rx="112" fill="#214D3B" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="#265944" stroke="#367a5e" stroke-width="6" />

  <!-- Chef Cat Group -->
  <g transform="translate(42, 32)" filter="url(#shadow512)">
    <!-- Ears -->
    <polygon points="90,202 58,90 154,149" fill="#F4A261" stroke="#E76F51" stroke-width="6" stroke-linejoin="round" />
    <polygon points="96,186 74,112 144,154" fill="#FFCCD5" />

    <polygon points="338,202 370,90 274,149" fill="#F4A261" stroke="#E76F51" stroke-width="6" stroke-linejoin="round" />
    <polygon points="332,186 354,112 284,154" fill="#FFCCD5" />

    <!-- Head -->
    <ellipse cx="214" cy="245" rx="144" ry="122" fill="#F4A261" />

    <!-- Cheeks & Muzzle Patch -->
    <ellipse cx="214" cy="278" rx="90" ry="64" fill="#FFF3E0" />

    <!-- Forehead Stripes -->
    <path d="M 214 154 L 214 182 M 188 162 L 192 186 M 240 162 L 236 186" stroke="#E76F51" stroke-width="8" stroke-linecap="round" />

    <!-- Chef Toque Hat -->
    <g class="chef-hat">
      <rect x="166" y="117" width="96" height="26" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="5" />
      <!-- Puffs -->
      <path d="M 166 117 C 144 96 150 53 182 53 C 187 32 240 32 245 53 C 277 53 283 96 262 117 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="5" />
      <path d="M 197 69 C 203 90 203 107 203 117 M 229 69 C 229 90 229 107 229 117" stroke="#F3F4F6" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Eyes (Happy sparkling eyes) -->
    <g class="eyes">
      <ellipse cx="155" cy="240" rx="24" ry="27" fill="#1E293B" />
      <ellipse cx="149" cy="232" rx="9" ry="11" fill="#FFFFFF" />
      <circle cx="163" cy="248" r="4.8" fill="#FFFFFF" />

      <ellipse cx="273" cy="240" rx="24" ry="27" fill="#1E293B" />
      <ellipse cx="267" cy="232" rx="9" ry="11" fill="#FFFFFF" />
      <circle cx="281" cy="248" r="4.8" fill="#FFFFFF" />
    </g>

    <!-- Pink Cheeks -->
    <ellipse cx="118" cy="266" rx="18" ry="12" fill="#FF85A1" opacity="0.65" />
    <ellipse cx="310" cy="266" rx="18" ry="12" fill="#FF85A1" opacity="0.65" />

    <!-- Nose & Mouth -->
    <polygon points="203,261 225,261 214,275" fill="#E76F51" />
    <path d="M 198,277 Q 214,272 230,277 Q 214,304 198,277 Z" fill="#991B1B" />
    <path d="M 203,285 Q 214,280 225,285 Q 214,301 203,285 Z" fill="#F87171" />

    <!-- Whiskers -->
    <line x1="96" y1="256" x2="42" y2="248" stroke="#6B7280" stroke-width="5" stroke-linecap="round" />
    <line x1="93" y1="272" x2="38" y2="280" stroke="#6B7280" stroke-width="5" stroke-linecap="round" />
    <line x1="332" y1="256" x2="386" y2="248" stroke="#6B7280" stroke-width="5" stroke-linecap="round" />
    <line x1="335" y1="272" x2="390" y2="280" stroke="#6B7280" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
